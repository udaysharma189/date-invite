<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Uday Sharma • Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 25px;
      font-family: Arial, sans-serif;

      background:
        radial-gradient(circle at 10% 10%, #ffd9e7, transparent 30%),
        radial-gradient(circle at 90% 90%, #e6dcff, transparent 30%),
        linear-gradient(135deg, #fff7fa, #f6f1ff);

      color: #392632;
    }

    .container {
      width: min(1000px, 100%);
      margin: auto;
    }

    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(15px);

      border-radius: 25px;
      padding: 30px;

      box-shadow: 0 20px 60px rgba(70, 30, 55, 0.15);
      border: 1px solid white;
    }

    /* LOGIN */

    .login-card {
      max-width: 430px;
      margin: 8vh auto;
    }

    .logo {
      width: 75px;
      height: 75px;

      margin: auto;
      margin-bottom: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 22px;

      background: #fff0f5;

      font-size: 35px;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 32px;
    }

    .subtitle {
      text-align: center;
      color: #806774;
      margin: 10px 0 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;

      font-size: 13px;
      font-weight: bold;
    }

    input {
      width: 100%;

      padding: 14px;

      border: 1px solid #ead8e0;
      border-radius: 14px;

      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #d94f7d;

      box-shadow:
        0 0 0 4px rgba(217, 79, 125, 0.1);
    }

    button {
      width: 100%;

      margin-top: 20px;
      padding: 14px;

      border: none;
      border-radius: 14px;

      background: linear-gradient(
        135deg,
        #e65083,
        #c93569
      );

      color: white;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 10px 25px rgba(201, 53, 105, 0.2);
    }

    button:hover {
      transform: translateY(-2px);
    }

    .error {
      display: none;

      margin-top: 15px;
      padding: 12px;

      border-radius: 12px;

      background: #fff0f2;
      color: #a53655;

      font-size: 14px;
    }

    /* DASHBOARD */

    .dashboard {
      display: none;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 25px;
    }

    .header h1 {
      text-align: left;
    }

    .header p {
      color: #806774;
      margin: 5px 0 0;
    }

    .logout {
      width: auto;

      margin: 0;

      padding: 10px 18px;

      background: #f3e9ee;
      color: #694d5a;

      box-shadow: none;
    }

    /* STATS */

    .stats {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 15px;

      margin-bottom: 20px;
    }

    .stat {
      background: white;

      border: 1px solid #eee0e6;

      border-radius: 17px;

      padding: 18px;
    }

    .stat span {
      color: #8b7480;

      font-size: 12px;
      font-weight: bold;
    }

    .stat strong {
      display: block;

      margin-top: 6px;

      font-size: 24px;
    }

    /* TABLE */

    .table-container {
      overflow-x: auto;

      border-radius: 17px;

      border: 1px solid #eee0e6;
    }

    table {
      width: 100%;

      min-width: 700px;

      border-collapse: collapse;

      background: white;
    }

    th,
    td {
      padding: 14px;

      text-align: left;

      border-bottom: 1px solid #f0e5ea;

      font-size: 14px;
    }

    th {
      background: #fff5f8;

      color: #694654;

      font-size: 12px;

      text-transform: uppercase;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .status {
      color: #806774;

      margin-bottom: 12px;

      font-size: 14px;
    }

    .empty {
      text-align: center;

      padding: 30px;

      color: #8b7480;
    }

    @media (max-width: 650px) {

      body {
        padding: 15px;
      }

      .card {
        padding: 20px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .header {
        align-items: flex-start;
      }

      .header h1 {
        font-size: 25px;
      }

    }
  </style>
</head>

<body>

  <div class="container">

    <!-- LOGIN -->

    <div id="loginCard" class="card login-card">

      <div class="logo">
        🔐
      </div>

      <h1>
        Admin Login
      </h1>

      <p class="subtitle">
        Uday Sharma • Date Invite ❤️
        <br>
        Login to see all responses.
      </p>

      <form id="loginForm">

        <label>
          Admin Email
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter admin email"
          required
        >

        <label>
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Enter password"
          required
        >

        <button type="submit">
          Login →
        </button>

        <div id="loginError" class="error"></div>

      </form>

    </div>


    <!-- DASHBOARD -->

    <div id="dashboard" class="card dashboard">

      <div class="header">

        <div>

          <h1>
            Responses ❤️
          </h1>

          <p>
            Uday Sharma • Date Invite Admin
          </p>

        </div>

        <button
          class="logout"
          id="logoutBtn"
        >
          Logout
        </button>

      </div>


      <!-- STATS -->

      <div class="stats">

        <div class="stat">

          <span>
            Total Responses
          </span>

          <strong id="total">
            0
          </strong>

        </div>


        <div class="stat">

          <span>
            Latest Name
          </span>

          <strong id="latestName">
            —
          </strong>

        </div>


        <div class="stat">

          <span>
            Latest Food
          </span>

          <strong id="latestFood">
            —
          </strong>

        </div>

      </div>


      <div id="status" class="status">
        Loading responses...
      </div>


      <!-- TABLE -->

      <div class="table-container">

        <table>

          <thead>

            <tr>

              <th>
                Name
              </th>

              <th>
                Answer
              </th>

              <th>
                Date
              </th>

              <th>
                Time
              </th>

              <th>
                Food
              </th>

              <th>
                Submitted
              </th>

            </tr>

          </thead>


          <tbody id="responsesBody">

            <tr>

              <td
                colspan="6"
                class="empty"
              >
                Loading...
              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>


<script>

  /*
    ================================
    SUPABASE CONFIG
    ================================
  */

  const SUPABASE_URL =
    "https://mddidbfndmmwoignvcqk.supabase.co";


  const SUPABASE_PUBLISHABLE_KEY =
    "PASTE_YOUR_PUBLISHABLE_KEY_HERE";


  const db =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /*
    ================================
    LOGIN
    ================================
  */

  const loginForm =
    document.getElementById("loginForm");


  const loginCard =
    document.getElementById("loginCard");


  const dashboard =
    document.getElementById("dashboard");


  const loginError =
    document.getElementById("loginError");


  loginForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      loginError.style.display =
        "none";


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      const { error } =
        await db.auth.signInWithPassword({

          email: email,

          password: password

        });


      if (error) {

        loginError.textContent =
          error.message;

        loginError.style.display =
          "block";

        return;

      }


      showDashboard();

    }
  );


  /*
    ================================
    SHOW DASHBOARD
    ================================
  */

  async function showDashboard() {

    loginCard.style.display =
      "none";


    dashboard.style.display =
      "block";


    loadResponses();

  }


  /*
    ================================
    LOAD RESPONSES
    ================================
  */

  async function loadResponses() {

    const status =
      document.getElementById("status");


    const body =
      document.getElementById(
        "responsesBody"
      );


    const { data, error } =
      await db
        .from("date_responses")
        .select(
          "id,name,answer,date,time,food,created_at"
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      status.textContent =
        "Error: " + error.message;


      body.innerHTML = `
        <tr>
          <td
            colspan="6"
            class="empty"
          >
            Could not load responses.
            <br><br>
            Check your Supabase SELECT policy.
          </td>
        </tr>
      `;

      return;

    }


    status.textContent =
      data.length +
      " response(s) found";


    document.getElementById(
      "total"
    ).textContent =
      data.length;


    if (data.length > 0) {

      document.getElementById(
        "latestName"
      ).textContent =
        data[0].name || "—";


      document.getElementById(
        "latestFood"
      ).textContent =
        data[0].food || "—";

    }


    if (data.length === 0) {

      body.innerHTML = `
        <tr>
          <td
            colspan="6"
            class="empty"
          >
            No responses yet ❤️
          </td>
        </tr>
      `;

      return;

    }


    body.innerHTML =
      data.map(function(row) {

        return `

          <tr>

            <td>
              ${safe(row.name || "—")}
            </td>

            <td>
              ${safe(row.answer || "—")}
            </td>

            <td>
              ${formatDate(row.date)}
            </td>

            <td>
              ${formatTime(row.time)}
            </td>

            <td>
              ${safe(row.food || "—")}
            </td>

            <td>
              ${formatSubmitted(row.created_at)}
            </td>

          </tr>

        `;

      }).join("");

  }


  /*
    ================================
    LOGOUT
    ================================
  */

  document
    .getElementById("logoutBtn")
    .addEventListener(
      "click",
      async function() {

        await db.auth.signOut();


        dashboard.style.display =
          "none";


        loginCard.style.display =
          "block";


        loginForm.reset();

      }
    );


  /*
    ================================
    DATE FORMAT
    ================================
  */

  function formatDate(value) {

    if (!value)
      return "—";


    const date =
      new Date(
        value + "T00:00:00"
      );


    return date.toLocaleDateString(
      undefined,
      {
        day: "numeric",
        month: "short",
        year: "numeric"
      }
    );

  }


  /*
    ================================
    TIME FORMAT
    ================================
  */

  function formatTime(value) {

    if (!value)
      return "—";


    const parts =
      value.split(":");


    const date =
      new Date();


    date.setHours(
      Number(parts[0]),
      Number(parts[1]),
      0,
      0
    );


    return date.toLocaleTimeString(
      undefined,
      {
        hour: "numeric",
        minute: "2-digit"
      }
    );

  }


  /*
    ================================
    SUBMITTED TIME
    ================================
  */

  function formatSubmitted(value) {

    if (!value)
      return "—";


    return new Date(value)
      .toLocaleString(
        undefined,
        {
          day: "numeric",
          month: "short",
          hour: "numeric",
          minute: "2-digit"
        }
      );

  }


  /*
    ================================
    SECURITY
    ================================
  */

  function safe(value) {

    return String(value)
      .replace(
        /[&<>"']/g,
        function(character) {

          return {

            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"

          }[character];

        }
      );

  }


  /*
    ================================
    AUTO LOGIN CHECK
    ================================
  */

  async function checkLogin() {

    const { data } =
      await db.auth.getSession();


    if (data.session) {

      showDashboard();

    }

  }


  checkLogin();

</script>

</body>
</html>
